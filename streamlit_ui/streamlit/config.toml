# ==========================================
# STREAMLIT CONFIGURATION
# Python Mentor RAG Assistant v2.0
# ==========================================

[server]
# Server host (0.0.0.0 for all interfaces, localhost for local only)
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

# File watcher
fileWatcherType = "auto"

[browser]
# Open browser on startup
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[theme]
# Primary color (buttons, links)
primaryColor = "#FF4B4B"

# Background color
backgroundColor = "#FFFFFF"

# Secondary background color (sidebar, etc.)
secondaryBackgroundColor = "#F0F2F6"

# Text color
textColor = "#262730"

# Font
font = "sans serif"

[client]
# Toolbar mode
toolbarMode = "minimal"

# Show error details
showErrorDetails = true

[runner]
# Magic enabled
magicEnabled = true

# Fast rerun
fastReruns = true

# Post script auto-rerun
postScriptGC = true

[logger]
# Logging level: "error", "warning", "info", "debug"
level = "info"

# Message format
messageFormat = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[deprecation]
# Show deprecation warnings
showfileUploaderEncoding = false
showPyplotGlobalUse = false